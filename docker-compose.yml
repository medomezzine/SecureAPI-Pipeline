services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_FILE: /app/data/notes.db
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      NOTES_ENCRYPTION_KEY: ${NOTES_ENCRYPTION_KEY:?Set a 64-character hex encryption key in .env}
    volumes:
      - notes-data:/app/data
volumes:
  notes-data:
